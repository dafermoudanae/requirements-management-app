<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<title>Generate Diagram</title>
</head>

<body>
	<div class="container">
		<div th:replace="~{fragments/navbar :: navbar}"></div>
		<br>
		
		<p class="h4 mb-4">
			Generate Diagram for project with title &mdash; <span class="badge bg-primary" th:text="${project.title}"></span>
		</p>
		<hr>
		
		 <form th:action="@{/diagram/generate}" method="GET">
		 	<input type="hidden" name="projectId" th:value="${project.id}" />
		 	
		 	<div class="mb-4">
		 		<label><b>Diagram Tool:</b></label>
		 		<div class="form-check">
		 			<input class="form-check-input" type="radio" name="tool" value="plantuml" id="plantuml" checked>
		 			<label class="form-check-label" for="plantuml">PlantUML</label>
		 		</div>
		 		<div class="form-check">
		 			<input class="form-check-input" type="radio" name="tool" value="nomnoml" id="nomnoml">
		 			<label class="form-check-label" for="nomnoml">Nomnoml</label>
		 		</div>
		 	</div>
		 	
		 	<div class="mb-4">
		 		<label><b>Diagram Type:</b></label>
		 		<div class="form-check">
		 			<input class="form-check-input" type="radio" name="type" value="usecase" id="usecase" checked>
		 			<label class="form-check-label" for="usecase">Use Case Diagram</label>
		 		</div>
		 		<div class="form-check">
		 			<input class="form-check-input" type="radio" name="type" value="class" id="class">
		 			<label class="form-check-label" for="class">Class Diagram (CRC Cards)</label>
		 		</div>
		 	</div>
		 	
		 	<button type="submit" class="btn btn-primary">Generate</button>
		 </form>
		 
		<hr>
    	<a th:href="@{/project/list}" class="btn btn-secondary btn-sm">Back to Projects</a>
	</div>
</body>
</html>
