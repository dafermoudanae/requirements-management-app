<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<title>Project Form</title>
</head>

<body>
	<div class="container">
		<div th:replace="~{fragments/navbar :: navbar}"></div>
		<br>
				
		<form th:action="@{/project/save}" th:object="${project}" method="POST">
			<input type="hidden" th:field="*{id}" />
			
			<label><b>Project title:</b></label>
			<input type="text" th:field="*{title}" required
				class="form-control mb-4 col-6"
				placeholder="Project title" />
			
			<label><b>Description:</b></label>
			<textarea th:field="*{description}" required
				class="form-control mb-4 col-6"
				placeholder="Description" rows="3">
			</textarea>
			
			<div class="form-group col-6 px-0">
				<label for="teammateIds"><b>Add Teammates:</b></label>
				<br>
				<small class="form-text text-muted">(Hold 'Ctrl' to select multiple teammates)</small>
				<select id="teammateIds" name="teammateIds"	class="form-control" multiple size="5">
					<option 
						th:each="user : ${allUsers}" 
						th:value="${user.id}" 
						th:text="${user.name + ' (' + user.username + ')'}" 
						th:selected="${memberIds.contains(user.id)}">
					</option>
				</select>
			</div>
			
			<div class="form-group col-6 px-0 mb-3">
				<label><b>Owner:</b></label>
				<input disabled type="text" class="form-control" th:value="${(owner.user.name != null ? owner.user.name : '-') + ' (' + owner.user.username + ')'}" readonly />
			</div>
			
			<button type="submit" class="btn btn-info col-2 mt-2">Save</button>
		</form>
		<hr>
		<a th:href="@{/project/list}">Back to Projects List</a>
	</div>
</body>
</html>
