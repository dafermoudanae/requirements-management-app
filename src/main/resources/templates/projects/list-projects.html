<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<title>Projects</title>
</head>

<body>

<div class="container">
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<br>
		
	<a th:href="@{/project/showFormForAdd}"
		class="btn btn-primary btn-sm mb-3">
		Add Project
	</a>
	
	<table class="table table-bordered table-striped table-hover">
		<thead class="table-dark">
			<tr>
				<th>Title</th>
				<th>Description</th>
				<th>Action</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="project : ${projects}">
				<td th:text="${project.title}" />
				<td th:text="${project.description}" />
				<td>
					<a th:href="@{/project/showFormForUpdate(projectId=${project.id})}"
						class="btn btn-info btn-sm">
						Update
					</a>
					<a th:href="@{/project/delete(projectId=${project.id})}"
						class="btn btn-danger btn-sm"
						onclick="if (!(confirm('Are you sure you want to delete this project?'))) return false">
						Delete
					</a>
					<div class="btn-group">
                        <button type="button" class="btn btn-secondary btn-sm dropdown-toggle"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            View
                        </button>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item"
                                    th:href="@{/actor/list(projectId=${project.id})}">
                                    Actors
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item"
                                    th:href="@{/usecase/list(projectId=${project.id})}">
                                    Use Cases
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item"
                                    th:href="@{/crccard/list(projectId=${project.id})}">
                                    CRC Cards
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item"
                                    th:href="@{/diagram/view(projectId=${project.id})}">
                                    Generate Diagrams
                                </a>
                            </li>
                        </ul>
                    </div>
				</td>
			</tr>
		</tbody>
	</table>
</div>
</body>
</html>
