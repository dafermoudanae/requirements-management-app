<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<title>Login</title>
	<style>
        .sidenav {
            min-height: 100vh;
            background-color: #000;
            color: #fff;
            padding: 60px 40px;
        }
        .sidenav h2 {
            font-weight: 300;
        }
    </style>
</head>

<body>

<div class="container-fluid">
	<div class="row">
		<div class="col-md-4 sidenav d-none d-md-flex flex-column justify-content-center">
			<h2>Product Backlog</h2>
			<p class="mt-3">Login from here to access.</p>
		</div>
	
		<div class="col-md-8 d-flex align-items-center justify-content-center" style="min-height: 100vh;">
			<div class="w-100" style="max-width: 420px; padding: 40px 20px;">
 
                <h3 class="mb-4">Login</h3>
                
                <form th:action="@{/login}" method="post">
                	<div class="mb-3">
                		<label class="form-label">Username:</label>
                		<input type="text" name="username" class="form-control" placeholder="Enter username" required>
                	</div>
                	<div class="mb-3">
                		<label class="form-label">Password:</label>
                		<input type="password" name="password" class="form-control" placeholder="Enter password" required>
                	</div>
                	<button type="submit" class="btn btn-dark w-100">Login</button>
                	
                	<a th:href="@{/register}" class="btn btn-secondary w-100 mt-2">Register</a>
                	
                	<div th:if="${param.error}" class="alert alert-danger mt-3">
                		Invalid username or password.
                	</div>
                	<div th:if="${successMessage}" class="alert alert-success mt-3" th:text="${successMessage}"></div>
                </form>
            </div>
        </div>
	</div>
</div>
</body>
</html>
