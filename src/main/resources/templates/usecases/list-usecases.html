<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<title>Use Cases</title>
</head>

<body>
	<div class="container">
		<div th:replace="~{fragments/navbar :: navbar}"></div>
		<br>
		
		<p class="h4 mb-4">
			Use Cases for project with title &mdash; <span class="badge bg-primary" th:text="${project.title}"></span>
		</p>
		<hr>
		
		<a th:href="@{/usecase/showFormForAdd(projectId=${project.id})}"
			class="btn btn-primary btn-sm mb-3">
			Add Use Case
		</a>
		
		<table class="table table-bordered table-striped table-hover">
		<thead class="table-dark">
			<tr>
				<th>#</th>
				<th>Title</th>
				<th>Actors</th>
				<th>Preconditions</th>
				<th>Main FLow</th>
				<th>Postconditions</th>
				<th>Action</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="useCase, iterStat : ${useCases}">
				<td th:text="${iterStat.index + 1}" />
				<td th:text="${useCase.title}" />
				<td>
					<span th:each="actor, iterStatActor : ${useCase.actors}">
						<span th:text="${actor.name}"></span>
						<span th:if="${!iterStatActor.last}">, </span>
					</span>
				</td>
				<td th:text="${useCase.preconditions}" />
				<td th:text="${useCase.mainFlow}" />
				<td th:text="${useCase.postconditions}" />
				<td>
					<a th:href="@{/usecase/showFormForUpdate(useCaseId=${useCase.id}, projectId=${project.id})}"
						class="btn btn-info btn-sm">
						Update
					</a>
					<a th:href="@{/usecase/delete(useCaseId=${useCase.id}, projectId=${project.id})}"
						class="btn btn-danger btn-sm"
						onclick="if (!(confirm('Are you sure you want to delete this use case?'))) return false">
						Delete
					</a>
				</td>
			</tr>
		</tbody>
	</table>
	<hr>
    <a th:href="@{/project/list}" class="btn btn-secondary btn-sm">Back to Projects</a>
	</div>
</body>
</html>
